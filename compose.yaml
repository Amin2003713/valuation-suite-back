# Valuation Suite — SQL Server + API on a shared Docker network.
# Secrets come from .env (SA_PASSWORD) — never hardcoded here.
# Back4app: import this compose file; set SA_PASSWORD in their env settings.

name: valuation-suite

services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest   # mssql/server if you need full SQL Server (amd64 hosts)
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1433:1433"   # host access for migrations/tooling only; remove in prod
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - appnet
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release   # no secrets here — config is injected at runtime
    container_name: valuation-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Overrides appsettings.json at runtime (strongly-named env var), so no password in the image.
      ConnectionStrings__AssessmentDb: "Server=sqlserver,1433;Database=ValuationSuite;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true;"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:
    driver: bridge

volumes:
  sqldata:
