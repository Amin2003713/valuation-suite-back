# Valuation Suite API — Docker profile uses SQLite by default (Database__Provider=Sqlite),
# so a single container is enough. To run against SQL Server instead, set:
#   Database__Provider: SqlServer
#   ConnectionStrings__AssessmentDb: "Server=...;Database=ValuationSuite;User Id=sa;Password=...;TrustServerCertificate=True"
name: valuation-suite

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    container_name: valuation-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Zarinpal / Jwt / AdminBootstrap come from appsettings.json; override here if needed:
      # Zarinpal__MerchantId: "..."
      # Zarinpal__FrontendRedirectUrl: "https://your-frontend/payment/callback"
    ports:
      - "8080:8080"
    volumes:
      # SQLite database file lives here — survives container restarts/redeploys.
      - sqlite-data:/app/data
    restart: unless-stopped

volumes:
  sqlite-data:
